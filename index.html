<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clasificador de Perros y Gatos</title>

  <!-- 1. Cargar TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  
  <!-- 2. Cargar la librería oficial de Teachable Machine Image -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Clasificador de Perros y Gatos</h1>
    <p class="description">Selecciona una fotografía para identificar si corresponde a un perro o un gato.</p>

    <div class="upload-box">
      <label for="imageInput" class="btn-upload">Cargar imagen</label>
      <input type="file" id="imageInput" accept="image/*" onchange="predictImage(event)">
    </div>

    <div class="preview-card">
      <img id="preview" src="" alt="Vista previa de la imagen">
    </div>

    <div id="status-message" class="status">Cargando modelo de Inteligencia Artificial...</div>

    <div id="label-container" class="results-container"></div>
  </main>

  <!-- 3. Tu script al final para asegurar que las librerías anteriores ya se hayan cargado -->
  <script src="script.js"></script>
</body>
</html>
